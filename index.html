<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>團隊用餐登記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        "Microsoft JhengHei",
        "PingFang TC",
        sans-serif;
      color: #4a3728;
      background: #fdfaf4;
    }

    .container {
      display: flex;
      gap: 22px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
    }

    .left-panel {
      flex: 2;
      min-width: 0;
    }

    .right-panel {
      flex: 1;
      min-width: 290px;
      padding: 18px;
      background: #fffdf9;
      border: 1px solid #f0e1d6;
      border-radius: 10px;
    }

    .header-title {
      margin-bottom: 22px;
      color: #d35400;
      font-size: 26px;
      font-weight: bold;
    }

    .name-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .name-area label {
      font-weight: bold;
    }

    select {
      min-width: 180px;
      padding: 9px 12px;
      font-size: 16px;
      border: 1px solid #cfc5bc;
      border-radius: 7px;
      background: #ffffff;
    }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 15px;
    }

    #calendarTitle {
      min-width: 190px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-btn {
      width: 44px;
      height: 38px;
      cursor: pointer;
      background: #ffffff;
      border: 1px solid #cfc5bc;
      border-radius: 7px;
      font-size: 18px;
      font-weight: bold;
    }

    .nav-btn:hover {
      color: #ffffff;
      background: #e65100;
      border-color: #e65100;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      text-align: center;
    }

    .weekday {
      padding: 11px 0;
      font-weight: bold;
      border-bottom: 2px solid #f0e1d6;
    }

    .day {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 88px;
      padding: 7px 4px;
      border-radius: 10px;
      font-size: 17px;
      transition: 0.15s;
    }

    .day-number {
      font-weight: bold;
    }

    .meal-buttons {
      display: flex;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }

    .meal-btn {
      min-width: 31px;
      padding: 5px 7px;
      cursor: pointer;
      color: #735d51;
      background: #fff7ef;
      border: 1px solid #dfc9ba;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .meal-btn:hover {
      color: #d35400;
      background: #fff0e4;
      border-color: #e8a77c;
    }

    .meal-btn.selected {
      color: #ffffff;
      background: #e65100;
      border-color: #e65100;
      box-shadow: 0 3px 8px rgba(230, 81, 0, 0.24);
    }

    .day.empty {
      cursor: default;
    }

    .day.empty:hover {
      background: transparent;
    }

    /*
      休假日：灰色顯示，而且不能點選。
    */
    .day.off-day {
      color: #b5aaa3;
      background: #f1efed;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .day.off-day:hover {
      color: #b5aaa3;
      background: #f1efed;
    }

    .calendar-legend {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 16px;
      color: #706159;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .legend-duty {
      background: #ffffff;
      border: 1px solid #d6c8be;
    }

    .legend-off {
      background: #f1efed;
      border: 1px solid #d6c8be;
    }

    .legend-selected {
      background: #e65100;
    }

    .detail-title {
      margin-bottom: 14px;
      padding-bottom: 9px;
      border-bottom: 1px dashed #d6c8be;
      font-size: 20px;
      font-weight: bold;
    }

    .info-text {
      margin: 10px 0;
      color: #706159;
      line-height: 1.6;
    }

    .info-text span {
      color: #d35400;
      font-weight: bold;
    }

    .date-list {
      min-height: 120px;
      max-height: 210px;
      margin: 10px 0 18px;
      padding: 7px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #eadbd0;
      border-radius: 7px;
    }

    .date-item {
      padding: 8px 7px;
      border-bottom: 1px solid #f1e8e1;
    }

    .date-item:last-child {
      border-bottom: none;
    }

    .empty-message {
      padding: 12px 6px;
      color: #a4958b;
      text-align: center;
    }

    .calculation {
      margin-bottom: 10px;
      color: #657746;
      text-align: right;
      font-weight: bold;
    }

    .price-box {
      margin-bottom: 18px;
      color: #d35400;
      text-align: right;
      font-size: 22px;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      cursor: pointer;
      color: #ffffff;
      background: #e65100;
      border: none;
      border-radius: 7px;
      font-size: 19px;
      font-weight: bold;
    }

    .submit-btn:hover {
      background: #bf360c;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal {
      width: 100%;
      max-width: 370px;
      padding: 26px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .modal h3 {
      margin-top: 0;
      text-align: center;
      font-size: 22px;
    }

    .modal-content {
      line-height: 1.9;
    }

    .important {
      color: #d35400;
      font-weight: bold;
    }

    .modal-btns {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .modal-btn {
      flex: 1;
      padding: 11px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
    }

    .btn-cancel {
      color: #333333;
      background: #eeeeee;
      border: 1px solid #dddddd;
    }

    .btn-confirm {
      color: #ffffff;
      background: #e65100;
      border: 1px solid #e65100;
    }

    .modal-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .container {
        flex-direction: column;
        padding: 16px;
      }

      .right-panel {
        min-width: 0;
      }

      .name-area {
        align-items: flex-start;
        flex-direction: column;
      }

      select {
        width: 100%;
      }

      #calendarTitle {
        min-width: 145px;
        font-size: 20px;
      }

      .calendar-header {
        gap: 10px;
      }

      .day {
        min-height: 43px;
        font-size: 15px;
      }

      .weekday {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <section class="left-panel">

      <div class="header-title">
        團隊用餐登記 🍱
      </div>

      <div class="name-area">
        <label for="nameSelect">
          選擇姓名：
        </label>

        <select id="nameSelect">
          <option value="吳議員">吳議員</option>
          <option value="林俊廷">林俊廷</option>
          <option value="廖哲瑤">廖哲瑤</option>
          <option value="翁祥峰">翁祥峰</option>
          <option value="林建毓">林建毓</option>
          <option value="蔡育峰">蔡育峰</option>
          <option value="饒輝平">饒輝平</option>
          <option value="黃立緯">黃立緯</option>
          <option value="陳家寛">陳家寛</option>
          <option value="王哲璿">王哲璿</option>
          <option value="魏克峰">魏克峰</option>
          <option value="莊博舜">莊博舜</option>
          <option value="詹程勝">詹程勝</option>
          <option value="蔡崇民">蔡崇民</option>
          <option value="陳亮瑜">陳亮瑜</option>
          <option value="虞景良">虞景良</option>
          <option value="許育維">許育維</option>
          <option value="黃敘桓">黃敘桓</option>
          <option value="童揚">童揚</option>

        </select>
      </div>

      <div class="calendar-header">
        <button
          type="button"
          class="nav-btn"
          onclick="changeMonth(-1)"
          aria-label="上個月"
        >
          ◀
        </button>

        <span id="calendarTitle"></span>

        <button
          type="button"
          class="nav-btn"
          onclick="changeMonth(1)"
          aria-label="下個月"
        >
          ▶
        </button>
      </div>

      <div
        class="calendar-grid"
        id="calendarGrid"
      ></div>

      <div class="calendar-legend">
        <div class="legend-item">
          <span class="legend-dot legend-duty"></span>
          值勤日（可選午／晚）
        </div>

        <div class="legend-item">
          <span class="legend-dot legend-off"></span>
          休假日（不可選）
        </div>

        <div class="legend-item">
          <span class="legend-dot legend-selected"></span>
          已選日期
        </div>
      </div>

    </section>

    <aside class="right-panel">

      <div class="detail-title">
        📝 登記明細
      </div>

      <div class="info-text">
        餐點由餐飲公司統一供應，
        每餐
        <span>NT$ 100</span>
      </div>

      <div class="info-text">
        登記人員：
        <span id="displayName">吳議員</span>
      </div>

      <div class="info-text">
        已選擇用餐日期：
      </div>

      <div
        class="date-list"
        id="selectedDateList"
      ></div>

      <div
        class="calculation"
        id="calculationText"
      >
        0 餐 × NT$ 100
      </div>

      <div class="price-box">
        總金額：
        <span id="totalAmount">NT$ 0</span>
      </div>

      <button
        type="button"
        class="submit-btn"
        onclick="openModal()"
      >
        確認登記
      </button>

    </aside>

  </div>

  <div
    class="modal-overlay"
    id="confirmModal"
  >

    <div class="modal">

      <h3>🔍 請再次確認</h3>

      <div class="modal-content">
        登記人員：
        <span id="modalName" class="important"></span>
        <br>

        總餐數：
        <span id="modalDays" class="important"></span>
        餐
        <br>

        日期明細：
        <span id="modalDates" class="important"></span>
        <br>

        總金額：
        <span id="modalAmount" class="important"></span>
      </div>

      <div class="modal-btns">

        <button
          type="button"
          class="modal-btn btn-cancel"
          onclick="closeModal()"
        >
          返回修改
        </button>

        <button
          type="button"
          class="modal-btn btn-confirm"
          id="confirmSendButton"
          onclick="submitData()"
        >
          確認送出
        </button>

      </div>

    </div>

  </div>

  <script>
    /*
      Google Apps Script 網頁應用程式網址
    */
    const scriptURL =
      "https://script.google.com/macros/s/AKfycby2OipRSLmHTkVJACEpbF8OBqji9eQ5Hvmp8j88ojR-G37JfQJfd5BeETlXiYatnNM9/exec";

    const pricePerMeal = 100;

    /*
      預設顯示目前月份。
    */
    const today = new Date();

    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1;

    /*
      班表基準：
      2026/08/01 是值勤日。
      之後依照「值勤一天、休假一天」持續輪替。
    */
    const dutyBaseDate =
      Date.UTC(2026, 7, 1);

    /*
      每次只登記一個月份。
      資料格式：
      {
        "2026/8/1": {
          lunch: true,
          dinner: false
        }
      }
    */
    let selectedMeals = {};

    function getTotalMeals() {
      let total = 0;

      Object.values(
        selectedMeals
      ).forEach(
        function (meals) {
          if (meals.lunch) {
            total++;
          }

          if (meals.dinner) {
            total++;
          }
        }
      );

      return total;
    }

    function toggleMeal(
      dateStr,
      mealType
    ) {
      if (!selectedMeals[dateStr]) {
        selectedMeals[dateStr] = {
          lunch: false,
          dinner: false
        };
      }

      selectedMeals[dateStr][mealType] =
        !selectedMeals[dateStr][mealType];

      if (
        !selectedMeals[dateStr].lunch &&
        !selectedMeals[dateStr].dinner
      ) {
        delete selectedMeals[dateStr];
      }

      initCalendar();
      updateDetails();
    }

    /*
      判斷指定日期是不是值勤日。
      使用 UTC 計算，避免時間或時區造成日期誤差。
    */
    function isDutyDay(
      year,
      month,
      day
    ) {
      const targetDate =
        Date.UTC(
          year,
          month - 1,
          day
        );

      const differenceDays =
        Math.round(
          (
            targetDate -
            dutyBaseDate
          ) /
          (
            1000 *
            60 *
            60 *
            24
          )
        );

      return (
        Math.abs(
          differenceDays
        ) %
        2 ===
        0
      );
    }

    document.addEventListener(
      "DOMContentLoaded",
      function () {
        initCalendar();
        updateDetails();

        document
          .getElementById("nameSelect")
          .addEventListener(
            "change",
            function (event) {
              document.getElementById(
                "displayName"
              ).innerText = event.target.value;
            }
          );
      }
    );

    function initCalendar() {
      const grid =
        document.getElementById("calendarGrid");

      const title =
        document.getElementById("calendarTitle");

      title.innerText =
        currentYear +
        " 年 " +
        currentMonth +
        " 月";

      grid.innerHTML = `
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      `;

      const firstDayIndex =
        new Date(
          currentYear,
          currentMonth - 1,
          1
        ).getDay();

      const totalDays =
        new Date(
          currentYear,
          currentMonth,
          0
        ).getDate();

      for (
        let i = 0;
        i < firstDayIndex;
        i++
      ) {
        const emptyDiv =
          document.createElement("div");

        emptyDiv.className = "day empty";

        grid.appendChild(emptyDiv);
      }

      for (
        let day = 1;
        day <= totalDays;
        day++
      ) {
        const dayDiv =
          document.createElement("div");

        dayDiv.className = "day";

        const dayNumber =
          document.createElement("div");

        dayNumber.className =
          "day-number";

        dayNumber.innerText = day;

        dayDiv.appendChild(dayNumber);

        const dateStr =
          currentYear +
          "/" +
          currentMonth +
          "/" +
          day;

        const dutyDay =
          isDutyDay(
            currentYear,
            currentMonth,
            day
          );

        /*
          休假日只顯示，不加入點擊功能。
        */
        if (!dutyDay) {
          dayDiv.classList.add(
            "off-day"
          );

          dayDiv.title =
            "休假日，不開放用餐登記";

          grid.appendChild(dayDiv);
          continue;
        }

        const mealButtons =
          document.createElement("div");

        mealButtons.className =
          "meal-buttons";

        const lunchButton =
          document.createElement("button");

        lunchButton.type = "button";
        lunchButton.className =
          "meal-btn";
        lunchButton.innerText = "午";
        lunchButton.title = "選擇午餐";

        const dinnerButton =
          document.createElement("button");

        dinnerButton.type = "button";
        dinnerButton.className =
          "meal-btn";
        dinnerButton.innerText = "晚";
        dinnerButton.title = "選擇晚餐";

        if (
          selectedMeals[dateStr] &&
          selectedMeals[dateStr].lunch
        ) {
          lunchButton.classList.add(
            "selected"
          );
        }

        if (
          selectedMeals[dateStr] &&
          selectedMeals[dateStr].dinner
        ) {
          dinnerButton.classList.add(
            "selected"
          );
        }

        lunchButton.addEventListener(
          "click",
          function () {
            toggleMeal(
              dateStr,
              "lunch"
            );
          }
        );

        dinnerButton.addEventListener(
          "click",
          function () {
            toggleMeal(
              dateStr,
              "dinner"
            );
          }
        );

        mealButtons.appendChild(
          lunchButton
        );

        mealButtons.appendChild(
          dinnerButton
        );

        dayDiv.appendChild(
          mealButtons
        );

        grid.appendChild(dayDiv);
      }
    }

    function changeMonth(direction) {
      /*
        更換月份時清除上一個月份的選擇，
        避免資料寫入錯誤的工作表。
      */
      if (
        Object.keys(
          selectedMeals
        ).length > 0
      ) {
        const confirmChange =
          confirm(
            "切換月份會清除目前已選日期，確定要繼續嗎？"
          );

        if (!confirmChange) {
          return;
        }
      }

      selectedMeals = {};

      currentMonth += direction;

      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      }

      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }

      initCalendar();
      updateDetails();
    }

    function updateDetails() {
      const listContainer =
        document.getElementById(
          "selectedDateList"
        );

      const amountSpan =
        document.getElementById(
          "totalAmount"
        );

      const calculationText =
        document.getElementById(
          "calculationText"
        );

      listContainer.innerHTML = "";

      const selectedDateKeys =
        Object.keys(
          selectedMeals
        ).sort(
        function (a, b) {
          return (
            parseDate(a) -
            parseDate(b)
          );
        }
      );

      if (
        selectedDateKeys.length === 0
      ) {
        const emptyMessage =
          document.createElement("div");

        emptyMessage.className =
          "empty-message";

        emptyMessage.innerText =
          "尚未選擇午餐或晚餐";

        listContainer.appendChild(
          emptyMessage
        );
      }

      selectedDateKeys.forEach(
        function (dateStr) {
          const date = parseDate(dateStr);

          const month =
            date.getMonth() + 1;

          const day =
            date.getDate();

          const weekday =
            [
              "日",
              "一",
              "二",
              "三",
              "四",
              "五",
              "六"
            ][date.getDay()];

          const item =
            document.createElement("div");

          item.className = "date-item";

          const meals = [];

          if (
            selectedMeals[dateStr].lunch
          ) {
            meals.push("午");
          }

          if (
            selectedMeals[dateStr].dinner
          ) {
            meals.push("晚");
          }

          item.innerText =
            "📅 " +
            month +
            "/" +
            day +
            "（" +
            weekday +
            "）：" +
            meals.join("、");

          listContainer.appendChild(item);
        }
      );

      const totalMeals =
        getTotalMeals();

      const totalCost =
        totalMeals *
        pricePerMeal;

      calculationText.innerText =
        totalMeals +
        " 餐 × NT$ " +
        pricePerMeal;

      amountSpan.innerText =
        "NT$ " + totalCost;
    }

    function parseDate(dateStr) {
      const parts = dateStr.split("/");

      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2]),
        12,
        0,
        0
      );
    }

    function makeDateDetails() {
      return Object.keys(
        selectedMeals
      )
        .sort(
          function (a, b) {
            return (
              parseDate(a) -
              parseDate(b)
            );
          }
        )
        .map(
          function (dateStr) {
            const date =
              parseDate(dateStr);

            const month =
              date.getMonth() + 1;

            const day =
              date.getDate();

            const weekday =
              [
                "日",
                "一",
                "二",
                "三",
                "四",
                "五",
                "六"
              ][date.getDay()];

            const meals = [];

            if (
              selectedMeals[dateStr].lunch
            ) {
              meals.push("午");
            }

            if (
              selectedMeals[dateStr].dinner
            ) {
              meals.push("晚");
            }

            return (
              month +
              "/" +
              day +
              "（" +
              weekday +
              "）：" +
              meals.join("、")
            );
          }
        )
        .join("、");
    }

    function openModal() {
      const totalMeals =
        getTotalMeals();

      if (
        totalMeals === 0
      ) {
        alert(
          "請至少選擇一份午餐或晚餐！"
        );

        return;
      }

      const name =
        document.getElementById(
          "nameSelect"
        ).value;

      const totalAmount =
        totalMeals *
        pricePerMeal;

      const dateDetailsString =
        makeDateDetails();

      document.getElementById(
        "modalName"
      ).innerText = name;

      document.getElementById(
        "modalDays"
      ).innerText =
        totalMeals;

      document.getElementById(
        "modalDates"
      ).innerText =
        dateDetailsString;

      document.getElementById(
        "modalAmount"
      ).innerText =
        "NT$ " + totalAmount;

      document.getElementById(
        "confirmModal"
      ).style.display = "flex";
    }

    function closeModal() {
      document.getElementById(
        "confirmModal"
      ).style.display = "none";
    }

    function submitData() {
      const name =
        document.getElementById(
          "nameSelect"
        ).value;

      /*
        Apps Script 目前仍使用 totalDays 這個欄位名稱，
        但傳送的內容已改為「總餐數」。
      */
      const totalMeals =
        getTotalMeals();

      const totalAmount =
        totalMeals *
        pricePerMeal;

      const dateDetailsString =
        makeDateDetails();

      /*
        工作表名稱格式：
        2026/08、2026/09、2026/10
      */
      const sheetName =
        currentYear +
        "/" +
        String(
          currentMonth
        ).padStart(2, "0");

      const formData =
        new URLSearchParams();

      formData.append(
        "sheetName",
        sheetName
      );

      formData.append(
        "name",
        name
      );

      formData.append(
        "totalDays",
        totalMeals
      );

      formData.append(
        "totalAmount",
        totalAmount
      );

      formData.append(
        "dates",
        dateDetailsString
      );

      const submitButton =
        document.getElementById(
          "confirmSendButton"
        );

      submitButton.disabled = true;
      submitButton.innerText =
        "送出中…";

      /*
        使用 no-cors 避免 GitHub Pages
        被 Apps Script 跨網域限制阻擋。
      */
      fetch(
        scriptURL,
        {
          method: "POST",
          mode: "no-cors",
          body: formData
        }
      )
      .then(
        function () {
          alert(
            "資料已送出！\n\n" +
            "登記人員：" +
            name +
            "\n" +
            "用餐日期：" +
            dateDetailsString +
            "\n" +
            "總金額：NT$ " +
            totalAmount
          );

          selectedMeals = {};

          initCalendar();
          updateDetails();
          closeModal();
        }
      )
      .catch(
        function (error) {
          console.error(
            "送出失敗：",
            error
          );

          alert(
            "送出失敗，請檢查網路或 Apps Script 網址。"
          );
        }
      )
      .finally(
        function () {
          submitButton.disabled = false;
          submitButton.innerText =
            "確認送出";
        }
      );
    }

    /*
      點擊黑色背景時關閉確認視窗。
    */
    document
      .getElementById(
        "confirmModal"
      )
      .addEventListener(
        "click",
        function (event) {
          if (
            event.target.id ===
            "confirmModal"
          ) {
            closeModal();
          }
        }
      );
  </script>

</body>
</html>
