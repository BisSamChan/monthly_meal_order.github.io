<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團隊用餐登記</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #fdfaf4;
      color: #4a3728;
      margin: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .left-panel {
      flex: 2;
    }

    .right-panel {
      flex: 1;
      background-color: #fffdf9;
      border: 1px solid #f0e6df;
      border-radius: 8px;
      padding: 15px;
    }

    .header-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #d35400;
    }

    select {
      padding: 8px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      max-width: 200px;
      margin-bottom: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .nav-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 8px;
    }

    .weekday {
      font-weight: bold;
      padding: 10px 0;
      border-bottom: 2px solid #f0e6df;
    }

    .day {
      padding: 12px 0;
      cursor: pointer;
      border-radius: 50%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .day:hover {
      background-color: #f5f5f5;
    }

    .day.selected {
      background-color: #e65100;
      color: white;
      font-weight: bold;
    }

    .day.empty {
      cursor: default;
    }

    .day.empty:hover {
      background: none;
    }

    .detail-title {
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .info-text {
      margin: 8px 0;
      color: #7f8c8d;
    }

    .info-text span {
      color: #d35400;
      font-weight: bold;
    }

    .date-list {
      min-height: 100px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #f0e6df;
      padding: 5px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 15px;
      background: #fff;
    }

    .date-item {
      padding: 4px 5px;
      border-bottom: 1px solid #eee;
    }

    .price-box {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      color: #d35400;
      margin-bottom: 15px;
    }

    .submit-btn {
      width: 100%;
      background-color: #e65100;
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #bf360c;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .modal-btns {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-cancel {
      background: #eee;
      color: #333;
    }

    .btn-confirm {
      background: #e65100;
      color: white;
    }

    @media (max-width: 700px) {
      body {
        margin: 10px;
      }

      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left-panel">
      <div class="header-title">團隊用餐登記 🍱</div>

      <label for="nameSelect">選擇姓名：</label>

      <select id="nameSelect">
        <option value="陳志明">陳志明</option>
        <option value="林小美">林小美</option>
        <option value="王大同">王大同</option>
      </select>

      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span id="calendarTitle"></span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="right-panel">
      <div class="detail-title">📝 登記明細</div>

      <div class="info-text">
        餐點由餐飲公司統一供應，每份餐點
        <span>NT$ 100</span>
      </div>

      <div class="info-text">
        登記人員：
        <span id="displayName">陳志明</span>
      </div>

      <div class="info-text">已選擇用餐日期：</div>

      <div class="date-list" id="selectedDateList"></div>

      <div class="price-box">
        總金額：
        <span id="totalAmount">NT$ 0</span>
      </div>

      <button class="submit-btn" onclick="openModal()">
        確認登記
      </button>
    </div>

  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">

      <h3>🔍 請再次確認</h3>

      <p style="text-align:left; line-height:1.8;">
        登記人員：
        <span id="modalName"></span>
        <br>

        用餐天數：
        <span id="modalDays"
              style="color:#d35400; font-weight:bold;"></span>
        天
        <br>

        總金額：
        <span id="modalAmount"
              style="color:#d35400; font-weight:bold;"></span>
      </p>

      <div class="modal-btns">
        <button class="modal-btn btn-cancel"
                onclick="closeModal()">
          返回修改
        </button>

        <button class="modal-btn btn-confirm"
                onclick="submitData()">
          確認送出
        </button>
      </div>

    </div>
  </div>

  <script>
    /*
      將下面網址換成你的 Google Apps Script 網頁應用程式網址。
      尚未設定網址時，月曆及金額計算仍然可以正常使用。
    */
    const scriptURL = "https://script.google.com/macros/s/AKfycbzf63Fus5EfFM198K6PnPNFpIhXng-Z0vdEVTtI-6nK4Aa4A2nfaZb_OxxFXAuCSmbk/execL";

    const now = new Date();

    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth() + 1;

    const pricePerMeal = 100;

    let selectedDates = [];

    document.addEventListener("DOMContentLoaded", function () {
      initCalendar();
      updateDetails();

      document
        .getElementById("nameSelect")
        .addEventListener("change", function (event) {
          document.getElementById("displayName").innerText =
            event.target.value;
        });
    });

    function initCalendar() {
      const grid = document.getElementById("calendarGrid");
      const title = document.getElementById("calendarTitle");

      title.innerText =
        currentYear + " 年 " + currentMonth + " 月";

      grid.innerHTML = `
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      `;

      const firstDayIndex =
        new Date(currentYear, currentMonth - 1, 1).getDay();

      const totalDays =
        new Date(currentYear, currentMonth, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement("div");
        emptyDiv.className = "day empty";
        grid.appendChild(emptyDiv);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement("div");

        dayDiv.className = "day";
        dayDiv.innerText = day;

        const dateStr =
          currentYear + "/" + currentMonth + "/" + day;

        if (selectedDates.includes(dateStr)) {
          dayDiv.classList.add("selected");
        }

        dayDiv.onclick = function () {
          if (selectedDates.includes(dateStr)) {
            selectedDates = selectedDates.filter(function (date) {
              return date !== dateStr;
            });

            dayDiv.classList.remove("selected");
          } else {
            selectedDates.push(dateStr);
            dayDiv.classList.add("selected");
          }

          updateDetails();
        };

        grid.appendChild(dayDiv);
      }
    }

    function changeMonth(direction) {
      currentMonth += direction;

      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      }

      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }

      initCalendar();
    }

    function updateDetails() {
      const listContainer =
        document.getElementById("selectedDateList");

      const amountSpan =
        document.getElementById("totalAmount");

      listContainer.innerHTML = "";

      selectedDates.sort(function (a, b) {
        return new Date(a) - new Date(b);
      });

      if (selectedDates.length === 0) {
        listContainer.innerHTML =
          '<div class="date-item">尚未選擇日期</div>';
      }

      selectedDates.forEach(function (dateStr) {
        const date = new Date(dateStr);

        const month = date.getMonth() + 1;
        const day = date.getDate();

        const weekday =
          ["日", "一", "二", "三", "四", "五", "六"]
          [date.getDay()];

        const item = document.createElement("div");

        item.className = "date-item";

        item.innerText =
          "📅 " + month + "/" + day + "（" + weekday + "）";

        listContainer.appendChild(item);
      });

      const totalCost =
        selectedDates.length * pricePerMeal;

      amountSpan.innerText = "NT$ " + totalCost;
    }

    function openModal() {
      if (selectedDates.length === 0) {
        alert("請至少選擇一天用餐日期！");
        return;
      }

      const name =
        document.getElementById("nameSelect").value;

      document.getElementById("modalName").innerText =
        name;

      document.getElementById("modalDays").innerText =
        selectedDates.length;

      document.getElementById("modalAmount").innerText =
        "NT$ " + selectedDates.length * pricePerMeal;

      document.getElementById("confirmModal").style.display =
        "flex";
    }

    function closeModal() {
      document.getElementById("confirmModal").style.display =
        "none";
    }

    function submitData() {
      const name =
        document.getElementById("nameSelect").value;

      const totalDays = selectedDates.length;
      const totalAmount = totalDays * pricePerMeal;

      const dateDetailsString =
        selectedDates.map(function (dateStr) {
          const date = new Date(dateStr);

          const month = date.getMonth() + 1;
          const day = date.getDate();

          const weekday =
            ["日", "一", "二", "三", "四", "五", "六"]
            [date.getDay()];

          return (
            month + "/" + day + "（" + weekday + "）"
          );
        }).join("、");

      if (
        !scriptURL ||
        scriptURL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"
      ) {
        alert(
          "頁面功能正常，但尚未連接 Google Sheet。\n\n" +
          "登記人員：" + name + "\n" +
          "用餐日期：" + dateDetailsString + "\n\n" +
          "請先把 scriptURL 換成 Apps Script 網址。"
        );

        closeModal();
        return;
      }

      const formData = new URLSearchParams();

      /*
        Google Sheet：
        A欄＝姓名
        B欄＝用餐日期
      */
      formData.append(
  "sheetName",
  currentYear + "/" + String(currentMonth).padStart(2, "0")
  );

formData.append("name", name);
formData.append("totalDays", totalDays);
formData.append("totalAmount", totalAmount);
formData.append("dates", dateDetailsString);

      const submitButton =
        document.querySelector(".btn-confirm");

      submitButton.disabled = true;
      submitButton.innerText = "送出中…";

      fetch(scriptURL, {
  method: "POST",
  mode: "no-cors",
  body: formData
})
.then(function () {
  alert(
    "資料已送出！\n\n" +
    "登記人員：" + name + "\n" +
    "用餐日期：" + dateDetailsString + "\n" +
    "總金額：NT$ " + totalAmount
  );

  selectedDates = [];
  initCalendar();
  updateDetails();
  closeModal();
})
.catch(function (error) {
  console.error("送出失敗：", error);

  alert(
    "送出失敗，請檢查網路或 Apps Script 網址。"
  );
})
.finally(function () {
  submitButton.disabled = false;
  submitButton.innerText = "確認送出";
});

        selectedDates = [];

        initCalendar();
        updateDetails();
        closeModal();
      })
      .catch(function (error) {
        console.error("送出失敗：", error);

        alert(
          "送出失敗，請檢查 Apps Script 網址及部署權限。"
        );
      })
      .finally(function () {
        submitButton.disabled = false;
        submitButton.innerText = "確認送出";
      });
    }
  </script>

</body>
</html>
